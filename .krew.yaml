apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: pvu
spec:
  version: {{ .TagName }}
  homepage: https://github.com/kha7iq/pvu
  shortDescription: Inspect Kubernetes pod volumes.
  description: |
    pvu is a kubectl plugin for inspecting pod volumes.
    It can open an interactive TUI to browse pods in a namespace,
    or print volume details directly for a specific pod.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/kha7iq/pvu/releases/download/{{ .TagName }}/pvu_Linux_x86_64.tar.gz
      sha256: {{ .Sha256 "pvu_Linux_x86_64.tar.gz" }}
      bin: kubectl-pvu

    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/kha7iq/pvu/releases/download/{{ .TagName }}/pvu_Linux_arm64.tar.gz
      sha256: {{ .Sha256 "pvu_Linux_arm64.tar.gz" }}
      bin: kubectl-pvu

    - selector:
        matchLabels:
          os: linux
          arch: arm
      uri: https://github.com/kha7iq/pvu/releases/download/{{ .TagName }}/pvu_Linux_armv7.tar.gz
      sha256: {{ .Sha256 "pvu_Linux_armv7.tar.gz" }}
      bin: kubectl-pvu

    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/kha7iq/pvu/releases/download/{{ .TagName }}/pvu_Darwin_x86_64.tar.gz
      sha256: {{ .Sha256 "pvu_Darwin_x86_64.tar.gz" }}
      bin: kubectl-pvu

    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/kha7iq/pvu/releases/download/{{ .TagName }}/pvu_Darwin_arm64.tar.gz
      sha256: {{ .Sha256 "pvu_Darwin_arm64.tar.gz" }}
      bin: kubectl-pvu

    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/kha7iq/pvu/releases/download/{{ .TagName }}/pvu_Windows_x86_64.zip
      sha256: {{ .Sha256 "pvu_Windows_x86_64.zip" }}
      bin: kubectl-pvu.exe